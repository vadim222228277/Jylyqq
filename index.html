<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MOLOT DUNGEON | 4 окна + подземелье</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;user-select:none;image-rendering:pixelated}
        body{min-height:100vh;background:#1a2f1f;background-image:radial-gradient(circle at 10% 20%,#3c5e2b,#1f3a1a);display:flex;justify-content:center;align-items:center;font-family:'Press Start 2P','Courier New',monospace;padding:16px}
        .game{max-width:700px;width:100%;background:#2c2c2c;border:4px solid #7c7c7c;box-shadow:0 0 0 4px #4c4c4c;border-radius:20px;padding:18px}
        .stats{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}
        .card{background:#1f1f1f;border:3px solid #6b6b6b;flex:1;padding:8px;text-align:center}
        .card span{font-size:0.55rem;color:#e0e0e0;display:block;margin-bottom:6px}
        .value{font-size:1.3rem;color:#ffd966;text-shadow:2px 2px 0 #4a3a1a}
        .bet-control{display:flex;margin-top:6px;background:#0f0f0f;border:2px solid #5c5c5c}
        .bet-control button{background:#3a3a3a;border:none;width:36px;font-size:1rem;color:#fff;cursor:pointer}
        .bet-control input{background:#2a2a2a;border:none;width:90px;text-align:center;color:#ffea9e;font-family:monospace;font-size:0.7rem}
        .action-group{display:flex;gap:10px;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap}
        .action-btn{background:#3d2b1a;border:none;font-size:0.65rem;padding:6px 12px;color:#ffdd99;box-shadow:0 4px 0 #1f1409;cursor:pointer;transition:0.05s}
        .action-btn:active{transform:translateY(2px)}
        .allin-btn{background:#6b4a2c;box-shadow:0 4px 0 #4a2a1a}
        .roulette{background:#1a1a1a;border:4px solid #6b4c2c;border-radius:20px;padding:14px;margin-bottom:20px;text-align:center}
        .windows{display:flex;gap:12px;justify-content:center;margin-bottom:15px;flex-wrap:wrap}
        .window{background:#111;border:3px solid #b97f3a;width:70px;padding:10px 0;border-radius:16px;text-align:center;font-size:1.2rem;box-shadow:inset 0 0 0 2px #684f28}
        .hammer-icon{font-size:2rem}
        .spin-btn{background:#567d46;border:none;font-size:0.8rem;padding:8px 18px;color:#fff;box-shadow:0 5px 0 #2d5420;cursor:pointer;width:70%}
        .spin-btn:active{transform:translateY(3px)}
        .dungeon-area{background:#2a241aea;border:3px solid #8b6946;padding:12px;margin-top:15px;border-radius:20px;display:none}
        .blocks-row{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
        .dungeon-block{background:#a87b3f;border:2px solid #533a1a;border-radius:12px;padding:8px;display:flex;justify-content:space-between;align-items:center;font-size:0.55rem;box-shadow:0 4px 0 #4a321a;transition:0.1s}
        .dungeon-block.active-block{box-shadow:0 0 0 2px #ffcc66;background:#c4913e}
        .dungeon-block.broken{filter:grayscale(0.7);opacity:0.6;transform:translateY(2px)}
        .hp-bar{background:#2e1e0e;border-radius:6px;padding:2px 6px;color:#ffd966}
        .hammer-stats{background:#1f1b14;padding:8px;border-radius:16px;display:flex;justify-content:space-between;font-size:0.6rem;margin:8px 0}
        .attack-btn{background:#8b5a2b;border:none;font-size:0.8rem;padding:8px;color:#fff;box-shadow:0 4px 0 #4a2a1a;cursor:pointer;width:100%}
        .info{background:#1f1b14;border:2px solid #8b6946;padding:8px;font-size:0.5rem;color:#eedd99;display:flex;justify-content:space-between;margin-top:12px}
        .reset-btn{background:#4a2a2a;border:none;color:#ffbb77;padding:4px 10px;cursor:pointer}
        .pixel-particle{position:fixed;width:6px;height:6px;background:#f5a442;pointer-events:none;z-index:200;animation:fly 0.4s ease-out forwards}
        @keyframes fly{0%{opacity:1}100%{opacity:0;transform:translate(calc(var(--dx)*1px),calc(var(--dy)*1px))}}
        @media (max-width:550px){.window{width:55px;font-size:0.9rem}.dungeon-block{font-size:0.45rem}}
    </style>
</head>
<body>
<div class="game">
    <div class="stats">
        <div class="card"><span>💰 БАЛАНС, ₽</span><div class="value" id="balance">1000</div></div>
        <div class="card"><span>⚙️ СТАВКА, ₽</span><div class="bet-control"><button id="betMinus">-</button><input type="number" id="betAmount" value="50" step="10" min="10"><button id="betPlus">+</button></div></div>
    </div>
    <div class="action-group">
        <button class="action-btn" id="depositSbpBtn">🏦 ПОПОЛНИТЬ (СБП)</button>
        <button class="action-btn" id="withdrawCardBtn">💳 ВЫВЕСТИ НА КАРТУ</button>
        <button class="action-btn allin-btn" id="allinBtn">🎲 ВА-БАНК</button>
    </div>
    <div class="roulette">
        <div class="windows" id="windowsContainer">
            <div class="window"><div class="hammer-icon">❓</div><span style="font-size:0.4rem;">окно 1</span></div>
            <div class="window"><div class="hammer-icon">❓</div><span style="font-size:0.4rem;">окно 2</span></div>
            <div class="window"><div class="hammer-icon">❓</div><span style="font-size:0.4rem;">окно 3</span></div>
            <div class="window"><div class="hammer-icon">❓</div><span style="font-size:0.4rem;">окно 4</span></div>
        </div>
        <div class="desc" id="rouletteDesc" style="margin:8px 0;">Нажми КРУТИТЬ, выпадут 4 молотка</div>
        <button class="spin-btn" id="spinBtn">🎲 КРУТИТЬ РУЛЕТКУ</button>
    </div>

    <div class="dungeon-area" id="dungeonArea">
        <div id="blocksList" class="blocks-row"></div>
        <div class="hammer-stats">
            <span>🔨 Молоток силы: <span id="hammerStrength">0</span>x</span>
            <span>⚡ Ударов осталось: <span id="hammerDurability">0</span></span>
        </div>
        <button class="attack-btn" id="attackBtn">💥 УДАРИТЬ ПО БЛОКУ 💥</button>
        <div style="font-size:0.5rem; margin-top:6px; text-align:center;" id="dungeonMsg">Блоки бьются сверху вниз → сундук внизу</div>
    </div>
    <div class="info">
        <span id="gameMsg">🔨 Шанс победы 15%! 4 окна → лучший молоток</span>
        <button class="reset-btn" id="resetBtn">🔄 СБРОС БАЛАНСА</button>
    </div>
</div>

<script>
    // ----- КОНФИГ -----
    const STORAGE_BALANCE = 'hammerDungeonBalance';
    const STORAGE_DEPOSITED = 'hammerTotalDeposited'; // сумма пополнений для условия вывода
    const DEFAULT_BALANCE = 1000;
    const MIN_BET = 10;
    const MAX_BET = 1000;          // лимит ставки 1000 ₽
    const WIN_CHANCE = 0.15;       // 15% на выигрыш (любой молоток)
    const HAMMER_STRENGTHS = [2,3,5,7]; // возможные силы молотка
    // Здоровье блоков (сумма = 2+3+4+5+6+1=21) Молотки имеют удары: 2x=6, 3x=11, 5x=21, 7x=30 (7x хватает на все)
    const HAMMER_DURABILITY = { 2:6, 3:11, 5:21, 7:30 };
    const BLOCKS_LIST = [
        { name: "🗻 Камень", hp: 2, multMin: 0.75, multMax: 2.0 },
        { name: "🌍 Земля", hp: 3, multMin: 1.0, multMax: 3.0 },
        { name: "🪵 Дерево", hp: 4, multMin: 1.5, multMax: 4.0 },
        { name: "⛏️ Руда", hp: 5, multMin: 2.0, multMax: 5.0 },
        { name: "🪨 Обсидиан", hp: 6, multMin: 3.0, multMax: 7.0 },
        { name: "🎁 СУНДУК", hp: 1, multMin: 10, multMax: 10, isChest: true }
    ];

    let balance = DEFAULT_BALANCE;
    let currentBet = 50;
    let totalDeposited = 0;        // сумма всех пополнений через СБП
    let phase = "idle";             // idle, spinning, dungeonActive
    let currentHammer = null;       // { strength, durabilityLeft }
    let dungeonState = {
        blocks: [],
        currentBlockIdx: 0,
        totalMultiplier: 1,
        completed: false
    };
    let windowsDivs = [];

    // DOM
    const balanceEl = document.getElementById('balance');
    const betInput = document.getElementById('betAmount');
    const spinBtn = document.getElementById('spinBtn');
    const rouletteDesc = document.getElementById('rouletteDesc');
    const gameMsgSpan = document.getElementById('gameMsg');
    const resetBtn = document.getElementById('resetBtn');
    const depositSbpBtn = document.getElementById('depositSbpBtn');
    const withdrawCardBtn = document.getElementById('withdrawCardBtn');
    const allinBtn = document.getElementById('allinBtn');
    const dungeonArea = document.getElementById('dungeonArea');
    const blocksList = document.getElementById('blocksList');
    const hammerStrengthSpan = document.getElementById('hammerStrength');
    const hammerDurabilitySpan = document.getElementById('hammerDurability');
    const attackBtn = document.getElementById('attackBtn');
    const dungeonMsgSpan = document.getElementById('dungeonMsg');
    const windowsContainer = document.getElementById('windowsContainer');

    // ----- ЗАГРУЗКА / СОХРАНЕНИЕ -----
    function loadData() {
        const savedBalance = localStorage.getItem(STORAGE_BALANCE);
        if (savedBalance && !isNaN(parseFloat(savedBalance))) balance = Math.max(0, parseFloat(savedBalance));
        else balance = DEFAULT_BALANCE;
        const savedDeposited = localStorage.getItem(STORAGE_DEPOSITED);
        totalDeposited = (savedDeposited && !isNaN(parseFloat(savedDeposited))) ? parseFloat(savedDeposited) : 0;
        updateUI();
    }
    function saveBalance() { localStorage.setItem(STORAGE_BALANCE, balance); }
    function saveDeposited() { localStorage.setItem(STORAGE_DEPOSITED, totalDeposited); }
    function updateUI() {
        balanceEl.innerText = Math.floor(balance);
        betInput.value = currentBet;
        const canSpin = (phase === "idle" && balance >= currentBet && currentBet <= MAX_BET);
        spinBtn.disabled = !canSpin;
    }
    function setMessage(msg, isError = false) {
        gameMsgSpan.innerHTML = msg;
        if (isError) setTimeout(() => { if (gameMsgSpan.innerHTML === msg) gameMsgSpan.innerHTML = "🔨 Шанс 15%! Крути 4 окна!"; }, 3000);
    }

    // ----- ПОПОЛНЕНИЕ / ВЫВОД (СИМУЛЯЦИЯ) -----
    function depositSBP() {
        if (phase !== "idle") { setMessage("Закончи раунд!", true); return; }
        let amount = prompt("💰 Пополнение через СБП\nВведите сумму (от 100 ₽):", "500");
        if (!amount) return;
        amount = parseInt(amount);
        if (isNaN(amount) || amount < 100) { setMessage("Минимум 100 ₽", true); return; }
        if (amount > 50000) amount = 50000;
        // симуляция перевода
        if (confirm(`СБП: пополнение на ${amount} ₽. Нажмите ОК для подтверждения.`)) {
            balance += amount;
            totalDeposited += amount;
            saveBalance();
            saveDeposited();
            updateUI();
            setMessage(`✅ Баланс пополнен на ${amount} ₽. Всего пополнено: ${totalDeposited} ₽`, false);
            if (totalDeposited >= 2000) setMessage(`🔓 Теперь доступен вывод средств!`, false);
        }
    }
    function withdrawToCard() {
        if (phase !== "idle") { setMessage("Закончи раунд!", true); return; }
        if (totalDeposited < 2000) {
            setMessage(`❌ Вывод недоступен. Пополните на сумму от 2000 ₽ (сейчас пополнено ${totalDeposited} ₽)`, true);
            return;
        }
        let amount = prompt("💳 Вывод на карту\nВведите сумму (мин 500 ₽):", "500");
        if (!amount) return;
        amount = parseInt(amount);
        if (isNaN(amount) || amount < 500) { setMessage("Минимум 500 ₽", true); return; }
        if (amount > balance) { setMessage("Недостаточно средств", true); return; }
        // симуляция вывода
        if (confirm(`Вывод ${amount} ₽ на карту. Средства будут отправлены в течение 1-3 дней. Продолжить?`)) {
            balance -= amount;
            saveBalance();
            updateUI();
            setMessage(`💸 Заявка на вывод ${amount} ₽ принята.`, false);
        }
    }

    // ----- ВА-БАНК -----
    function allin() {
        if (phase !== "idle") { setMessage("Закончи раунд!", true); return; }
        let maxPossible = Math.min(balance, MAX_BET);
        if (maxPossible < MIN_BET) { setMessage("Недостаточно для ставки", true); return; }
        currentBet = maxPossible;
        updateUI();
        setMessage(`🔥 ВА-БАНК! Ставка = ${currentBet} ₽`, false);
    }

    // ----- РУЛЕТКА С 4 ОКНАМИ (выпадают молотки, выбирается лучший) -----
    function spinWindows() {
        if (phase !== "idle") { setMessage("Сначала заверши подземелье!", true); return false; }
        if (balance < currentBet) { setMessage("Не хватает монет!", true); return false; }
        if (currentBet > MAX_BET) { setMessage(`Максимальная ставка ${MAX_BET} ₽`, true); return false; }
        balance -= currentBet;
        saveBalance();
        updateUI();
        phase = "spinning";
        spinBtn.disabled = true;
        setMessage("🎲 Выпадают молотки в 4 окнах...");
        rouletteDesc.innerText = "🔨 4 окна → лучший молоток";

        // Анимация прокрутки 4 окон
        let steps = 0;
        const maxSteps = 12;
        const interval = setInterval(() => {
            const fakeResults = [];
            for (let i = 0; i < 4; i++) {
                const randVal = Math.random() < WIN_CHANCE ? HAMMER_STRENGTHS[Math.floor(Math.random() * HAMMER_STRENGTHS.length)] : null;
                fakeResults.push(randVal);
            }
            updateWindowsUI(fakeResults);
            steps++;
            if (steps >= maxSteps) {
                clearInterval(interval);
                // Финальный результат с шансом 15% на выигрыш (любой молоток)
                const isWin = Math.random() < WIN_CHANCE;
                let finalResults = [null, null, null, null];
                let bestHammer = null;
                if (isWin) {
                    // Генерируем 4 случайных молотка (2,3,5,7) и выбираем максимальный
                    for (let i=0;i<4;i++) finalResults[i] = HAMMER_STRENGTHS[Math.floor(Math.random() * HAMMER_STRENGTHS.length)];
                    bestHammer = Math.max(...finalResults);
                } else {
                    // все окна пустые
                    bestHammer = null;
                }
                updateWindowsUI(finalResults);
                finishSpin(bestHammer);
            }
        }, 100);
        return true;
    }

    function updateWindowsUI(results) {
        windowsContainer.innerHTML = '';
        for (let i=0;i<4;i++) {
            const win = document.createElement('div');
            win.className = 'window';
            const val = results[i];
            let icon = '❓';
            if (val === null) icon = '💨';
            else icon = `🔨${val}x`;
            win.innerHTML = `<div class="hammer-icon">${icon}</div><span style="font-size:0.4rem;">окно ${i+1}</span>`;
            windowsContainer.appendChild(win);
        }
    }

    function finishSpin(hammerStrength) {
        if (hammerStrength === null) {
            rouletteDesc.innerText = "💨 ПУСТО! Проигрыш";
            setMessage(`😞 Проигрыш: -${currentBet} ₽`, false);
            phase = "idle";
            updateUI();
            spinBtn.disabled = false;
            dungeonArea.style.display = "none";
        } else {
            // Выиграли молоток
            rouletteDesc.innerText = `🏆 Молоток силы ${hammerStrength}x! Вперёд!`;
            setMessage(`🎉 Выпал лучший молоток x${hammerStrength}! Пробивай блоки!`, false);
            currentHammer = {
                strength: hammerStrength,
                durabilityLeft: HAMMER_DURABILITY[hammerStrength]
            };
            initDungeon();
            phase = "dungeonActive";
            dungeonArea.style.display = "block";
            updateDungeonUI();
            spinBtn.disabled = true;
        }
        updateUI();
    }

    // ----- ПОДЗЕМЕЛЬЕ (блоки сверху вниз, сундук внизу) -----
    function initDungeon() {
        dungeonState.blocks = BLOCKS_LIST.map(b => ({ ...b, currentHp: b.hp }));
        dungeonState.currentBlockIdx = 0;
        dungeonState.totalMultiplier = 1;
        dungeonState.completed = false;
        renderDungeon();
        dungeonMsgSpan.innerHTML = "🔨 Блоки бьются сверху вниз. Сундук внизу!";
    }
    function renderDungeon() {
        blocksList.innerHTML = '';
        dungeonState.blocks.forEach((block, idx) => {
            const blockDiv = document.createElement('div');
            blockDiv.className = 'dungeon-block';
            if (idx === dungeonState.currentBlockIdx && !dungeonState.completed) blockDiv.classList.add('active-block');
            if (block.currentHp <= 0) blockDiv.classList.add('broken');
            const multRange = block.isChest ? "x10" : `${block.multMin}–${block.multMax}x`;
            blockDiv.innerHTML = `
                <span>${block.name}</span>
                <span class="hp-bar">❤️ ${block.currentHp > 0 ? block.currentHp : 0}</span>
                <span style="font-size:0.45rem;">${multRange}</span>
            `;
            blocksList.appendChild(blockDiv);
        });
    }
    function updateDungeonUI() {
        if (!currentHammer) return;
        hammerStrengthSpan.innerText = currentHammer.strength;
        hammerDurabilitySpan.innerText = currentHammer.durabilityLeft;
        renderDungeon();
        if (dungeonState.completed) return;
        if (dungeonState.currentBlockIdx >= dungeonState.blocks.length) {
            finishDungeon(true);
        }
    }
    function attack() {
        if (phase !== "dungeonActive" || dungeonState.completed) return;
        if (currentHammer.durabilityLeft <= 0) {
            dungeonMsgSpan.innerHTML = "💔 Молоток сломался! Подземелье не пройдено.";
            finishDungeon(false);
            return;
        }
        let block = dungeonState.blocks[dungeonState.currentBlockIdx];
        if (!block || block.currentHp <= 0) {
            // перейти к следующему блоку
            dungeonState.currentBlockIdx++;
            if (dungeonState.currentBlockIdx >= dungeonState.blocks.length) {
                finishDungeon(true);
                return;
            }
            block = dungeonState.blocks[dungeonState.currentBlockIdx];
        }
        // удар
        currentHammer.durabilityLeft--;
        block.currentHp--;
        spawnParticles();

        if (block.currentHp <= 0) {
            // получаем множитель
            let mult = 0;
            if (block.isChest) mult = 10;
            else {
                let min = block.multMin, max = block.multMax;
                mult = +(Math.random() * (max - min) + min).toFixed(2);
            }
            dungeonState.totalMultiplier *= mult;
            dungeonMsgSpan.innerHTML = `💥 ${block.name} разрушен! +${mult}x к множителю!`;
            // автоматически переходим к следующему блоку
            dungeonState.currentBlockIdx++;
            if (dungeonState.currentBlockIdx >= dungeonState.blocks.length) {
                finishDungeon(true);
                return;
            }
        } else {
            dungeonMsgSpan.innerHTML = `⚡ Удар по ${block.name}! Осталось HP: ${block.currentHp}`;
        }
        updateDungeonUI();
        if (currentHammer.durabilityLeft <= 0 && !dungeonState.completed) {
            dungeonMsgSpan.innerHTML = "⚡ Молоток сломан...";
            finishDungeon(false);
        }
    }
    function finishDungeon(success) {
        if (dungeonState.completed) return;
        dungeonState.completed = true;
        let winAmount = 0;
        if (success && dungeonState.currentBlockIdx >= dungeonState.blocks.length) {
            winAmount = currentBet * dungeonState.totalMultiplier;
            balance += winAmount;
            setMessage(`🎉 ПОЛНЫЙ ПРОХОД! Выигрыш: ${winAmount} ₽ (x${dungeonState.totalMultiplier.toFixed(2)}) 🎉`, false);
        } else {
            // частичный прогресс
            winAmount = currentBet * dungeonState.totalMultiplier;
            balance += winAmount;
            setMessage(`🏆 Пройдено ${dungeonState.currentBlockIdx} блоков. Выигрыш: ${winAmount} ₽ (множитель x${dungeonState.totalMultiplier.toFixed(2)})`, false);
        }
        saveBalance();
        updateUI();
        phase = "idle";
        dungeonArea.style.display = "none";
        currentHammer = null;
        spinBtn.disabled = false;
        rouletteDesc.innerText = "Нажми КРУТИТЬ";
        updateUI();
    }
    function spawnParticles() {
        const btn = attackBtn;
        const rect = btn.getBoundingClientRect();
        for (let i=0;i<12;i++) {
            const p = document.createElement('div');
            p.className = 'pixel-particle';
            const dx = (Math.random() - 0.5)*50;
            const dy = (Math.random() - 0.5)*30 - 20;
            p.style.setProperty('--dx', dx);
            p.style.setProperty('--dy', dy);
            p.style.left = rect.left + rect.width/2 + 'px';
            p.style.top = rect.top + rect.height/2 + 'px';
            document.body.appendChild(p);
            setTimeout(()=>p.remove(),400);
        }
    }

    // ----- ОБЩИЕ ФУНКЦИИ -----
    function changeBet(delta) {
        if (phase !== "idle") { setMessage("Меняй ставку между раундами", true); return; }
        let newBet = currentBet + delta;
        newBet = Math.min(MAX_BET, Math.max(MIN_BET, newBet));
        if (newBet > balance && balance > 0) newBet = balance;
        if (newBet <= 0) newBet = MIN_BET;
        currentBet = newBet;
        updateUI();
    }
    function handleBetInput() {
        let val = parseInt(betInput.value);
        if (isNaN(val)) val = MIN_BET;
        val = Math.min(MAX_BET, Math.max(MIN_BET, val));
        if (val > balance) val = balance;
        if (val <= 0) val = MIN_BET;
        currentBet = val;
        updateUI();
    }
    function resetGame() {
        if (phase !== "idle") { setMessage("Сначала закончи раунд", true); return; }
        balance = DEFAULT_BALANCE;
        totalDeposited = 0;
        currentBet = Math.min(currentBet, MAX_BET);
        saveBalance();
        saveDeposited();
        updateUI();
        setMessage("Баланс сброшен до 1000 ₽, история пополнений обнулена", false);
        if (dungeonArea.style.display !== "none") dungeonArea.style.display = "none";
        phase = "idle";
        spinBtn.disabled = false;
    }

    // ----- ИНИЦИАЛИЗАЦИЯ -----
    function init() {
        loadData();
        updateUI();
        spinBtn.addEventListener('click', spinWindows);
        attackBtn.addEventListener('click', attack);
        document.getElementById('betMinus').addEventListener('click', () => changeBet(-10));
        document.getElementById('betPlus').addEventListener('click', () => changeBet(10));
        betInput.addEventListener('change', handleBetInput);
        resetBtn.addEventListener('click', resetGame);
        depositSbpBtn.addEventListener('click', depositSBP);
        withdrawCardBtn.addEventListener('click', withdrawToCard);
        allinBtn.addEventListener('click', allin);
        dungeonArea.style.display = "none";
        phase = "idle";
        // инициализация окон
        for (let i=0;i<4;i++) {
            let w = document.createElement('div');
            w.className = 'window';
            w.innerHTML = `<div class="hammer-icon">❓</div><span style="font-size:0.4rem;">окно ${i+1}</span>`;
            windowsContainer.appendChild(w);
        }
    }
    init();
</script>
</body>
</html>
