<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hammer Smash — круши блоки</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;user-select:none}
        body{min-height:100vh;background:radial-gradient(circle at 20% 30%,#1a2a2f,#0a1217);display:flex;justify-content:center;align-items:center;font-family:system-ui,sans-serif;padding:16px}
        .game{max-width:550px;width:100%;background:rgba(0,0,0,0.5);backdrop-filter:blur(12px);border-radius:48px;padding:20px;box-shadow:0 10px 25px rgba(0,0,0,0.3);border:1px solid rgba(255,200,100,0.3)}
        .stats{display:flex;gap:12px;margin-bottom:20px}
        .card{background:#00000066;flex:1;border-radius:40px;padding:12px;text-align:center}
        .card span:first-child{color:#ffd966;font-size:0.75rem;text-transform:uppercase}
        .card .value{font-size:1.8rem;font-weight:bold;color:#f5f0e0}
        .bet-control{display:flex;background:#1e2e34;border-radius:40px;margin-top:8px}
        .bet-control button{background:#3e5a64;border:none;width:44px;font-size:1.5rem;font-weight:bold;color:white;cursor:pointer;border-radius:40px}
        .bet-control input{background:#0f1c1f;border:none;text-align:center;width:100px;color:#ffecb3;font-weight:bold;font-size:1.2rem;outline:none}
        .roulette{background:#0f1a1ecc;border-radius:60px;padding:20px;text-align:center;margin-bottom:20px}
        .hammer{font-size:3rem;background:#00000066;display:inline-block;padding:8px 24px;border-radius:60px;margin-bottom:8px}
        .desc{color:#ffdfaa;background:#00000055;display:inline-block;padding:5px 16px;border-radius:30px;font-size:0.85rem}
        .spin-btn{background:linear-gradient(135deg,#ffb347,#ff7e05);border:none;font-size:1.4rem;font-weight:bold;padding:10px 20px;border-radius:40px;color:white;cursor:pointer;margin-top:15px;width:80%;box-shadow:0 5px 0 #9b4b00}
        .spin-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #9b4b00}
        .blocks{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:15px 0}
        .block{background:radial-gradient(ellipse at 30% 25%,#d4af6a,#8b5a2b);width:80px;height:90px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:bold;font-size:1.5rem;color:#2e241a;box-shadow:0 6px 0 #5a3a1a;cursor:pointer;transition:0.05s linear}
        .block span{font-size:0.7rem;background:#00000077;padding:2px 8px;border-radius:20px;color:#ffefb9;margin-top:5px}
        .block:active{transform:translateY(3px);box-shadow:0 2px 0 #5a3a1a}
        .disabled,.broken{filter:grayscale(0.6);opacity:0.5;pointer-events:none;transform:none !important}
        .info{background:#00000066;border-radius:40px;padding:8px 12px;font-size:0.75rem;text-align:center;color:#ffddbb;display:flex;justify-content:space-between;margin-top:10px}
        .reset-btn{background:#3a2a2a;border:none;color:#ffbb77;padding:4px 12px;border-radius:30px;cursor:pointer}
        button:disabled{opacity:0.5;transform:none;pointer-events:none}
        @media (max-width:500px){.block{width:70px;height:80px;font-size:1.2rem}.hammer{font-size:2rem}}
    </style>
</head>
<body>
<div class="game">
    <div class="stats">
        <div class="card"><span>💰 БАЛАНС</span><div class="value" id="balance">1000</div></div>
        <div class="card"><span>⚙️ СТАВКА</span><div class="bet-control"><button id="betMinus">-</button><input type="number" id="betAmount" value="50" step="10" min="10"><button id="betPlus">+</button></div></div>
    </div>
    <div class="roulette">
        <div class="hammer" id="hammerIcon">🔨 ?</div>
        <div class="desc" id="hammerDesc">Крути рулетку!</div>
        <button class="spin-btn" id="spinBtn">🎲 КРУТИТЬ</button>
    </div>
    <div style="text-align:center; color:#ffefcf; margin-bottom:8px;">💥 ВЫБЕРИ БЛОК 💥</div>
    <div class="blocks" id="blocksContainer"></div>
    <div class="info"><span id="gameMessage">🔨 Выпадет молоток → ломай блок x2,x3,x5,x7</span><button class="reset-btn" id="resetBtn">🔄 Сброс</button></div>
</div>
<script>
    // ----- НАСТРОЙКИ -----
    const STORAGE_KEY = 'hammerBalance';
    const DEFAULT_BALANCE = 1000;
    const MIN_BET = 10;
    const MAX_BET = 10000;
    const HAMMER_TYPES = [1,2,3,null]; // null = пусто
    const BLOCKS = [
        { mult: 2, emoji: "🪨" },
        { mult: 3, emoji: "🗿" },
        { mult: 5, emoji: "💎" },
        { mult: 7, emoji: "✨" }
    ];
    const POWER_NAMES = { 1:"🔨 Слабый", 2:"🔨🔨 Средний", 3:"🔨🔨🔨 Сильный" };

    // ----- СОСТОЯНИЕ -----
    let balance = DEFAULT_BALANCE;
    let currentBet = 50;
    let phase = "idle";        // idle, spinning, hammerReady, waitingReset
    let hammerPower = null;
    let blockUsed = false;
    let blocksDOM = [];

    // ----- DOM -----
    const balanceEl = document.getElementById('balance');
    const betInput = document.getElementById('betAmount');
    const spinBtn = document.getElementById('spinBtn');
    const hammerIcon = document.getElementById('hammerIcon');
    const hammerDesc = document.getElementById('hammerDesc');
    const blocksContainer = document.getElementById('blocksContainer');
    const gameMessageSpan = document.getElementById('gameMessage');
    const resetBtn = document.getElementById('resetBtn');

    // ----- ФУНКЦИИ -----
    function saveBalance() { localStorage.setItem(STORAGE_KEY, balance); }
    function loadBalance() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved && !isNaN(parseFloat(saved))) balance = Math.max(0, parseFloat(saved));
        else balance = DEFAULT_BALANCE;
        updateUI();
    }
    function updateUI() {
        balanceEl.innerText = Math.floor(balance);
        betInput.value = currentBet;
        const canSpin = (phase === "idle" && balance >= currentBet);
        spinBtn.disabled = !canSpin;
    }
    function setMessage(msg, isError = false) {
        gameMessageSpan.innerHTML = msg;
        if (isError) setTimeout(() => {
            if (gameMessageSpan.innerHTML === msg) 
                gameMessageSpan.innerHTML = "🔨 Выпадет молоток → ломай блок x2,x3,x5,x7";
        }, 2000);
    }
    function updateBlocksState() {
        const canInteract = (phase === "hammerReady" && !blockUsed);
        blocksDOM.forEach(block => {
            if (canInteract) {
                block.classList.remove('disabled', 'broken');
                block.style.pointerEvents = 'auto';
            } else {
                block.classList.add('disabled');
                block.style.pointerEvents = 'none';
            }
            if (blockUsed) block.classList.add('broken');
        });
    }
    function resetRound() {
        phase = "idle";
        hammerPower = null;
        blockUsed = false;
        hammerIcon.innerHTML = "🔨 ?";
        hammerDesc.innerText = "Крути рулетку!";
        updateBlocksState();
        updateUI();
    }
    function finishSpin(result) {
        hammerPower = result;
        if (result === null) {
            hammerIcon.innerHTML = "💨 ПУСТО";
            hammerDesc.innerText = "Ничего не выпало!";
            setMessage(`😞 Потеряно ${currentBet} монет.`, false);
            phase = "idle";
            blockUsed = false;
            updateBlocksState();
            updateUI();
            setTimeout(() => {
                if (phase === "idle") {
                    hammerIcon.innerHTML = "🔨 ?";
                    hammerDesc.innerText = "Крути рулетку!";
                }
            }, 1500);
        } else {
            const powerText = POWER_NAMES[result];
            hammerIcon.innerHTML = `${powerText} ⚡`;
            hammerDesc.innerText = `Сила ${result}x! Бей блок!`;
            setMessage(`🎉 Молоток силы ${result}! Нажми на любой блок!`, false);
            phase = "hammerReady";
            blockUsed = false;
            updateBlocksState();
        }
        spinBtn.disabled = false;
        updateUI();
    }
    function spinRoulette() {
        if (phase !== "idle") { setMessage("Заверши текущий раунд!", true); return false; }
        if (balance < currentBet) { setMessage("Не хватает монет!", true); return false; }
        balance -= currentBet;
        saveBalance();
        updateUI();
        phase = "spinning";
        spinBtn.disabled = true;
        setMessage("🎡 Рулетка крутится...");
        hammerIcon.innerHTML = "🌀🌀🌀";
        hammerDesc.innerText = "Выпадает...";
        
        const outcomes = HAMMER_TYPES;
        let step = 0;
        const maxSteps = 12;
        const interval = setInterval(() => {
            const rand = outcomes[Math.floor(Math.random() * outcomes.length)];
            if (rand === null) {
                hammerIcon.innerHTML = "💨 ?";
                hammerDesc.innerText = "Мимо...";
            } else {
                hammerIcon.innerHTML = POWER_NAMES[rand] + " ⚡".repeat(rand);
                hammerDesc.innerText = `Сила ${rand}x`;
            }
            step++;
            if (step >= maxSteps) {
                clearInterval(interval);
                const final = outcomes[Math.floor(Math.random() * outcomes.length)];
                finishSpin(final);
            }
        }, 65);
        return true;
    }
    function useHammer(blockIndex, multiplier) {
        if (phase !== "hammerReady" || blockUsed || hammerPower === null) {
            setMessage("Сначала выиграй молоток!", true);
            return;
        }
        const win = currentBet * multiplier * hammerPower;
        balance += win;
        blockUsed = true;
        saveBalance();
        updateUI();
        // анимация
        const blockEl = blocksDOM[blockIndex];
        blockEl.style.transform = "scale(0.95)";
        setTimeout(() => blockEl.style.transform = "", 120);
        hammerIcon.innerHTML = `💥 ${POWER_NAMES[hammerPower]} 💥`;
        hammerDesc.innerText = `Удар! +${win} монет`;
        setMessage(`🎉 Разбил блок x${multiplier} молотком силы ${hammerPower}! Выигрыш: ${win} 🎉`, false);
        phase = "waitingReset";
        updateBlocksState();
        setTimeout(() => {
            if (phase === "waitingReset") {
                resetRound();
                setMessage("🔨 Крути рулетку снова!", false);
                updateUI();
            }
        }, 1800);
    }
    function buildBlocks() {
        blocksContainer.innerHTML = "";
        blocksDOM = [];
        BLOCKS.forEach((block, idx) => {
            const div = document.createElement('div');
            div.className = 'block';
            div.innerHTML = `🔨 ${block.mult}x<br><span>${block.emoji}</span>`;
            div.addEventListener('click', (e) => {
                e.stopPropagation();
                useHammer(idx, block.mult);
            });
            blocksContainer.appendChild(div);
            blocksDOM.push(div);
        });
        updateBlocksState();
    }
    function changeBet(delta) {
        if (phase !== "idle") { setMessage("Меняй ставку между раундами", true); return; }
        let newBet = currentBet + delta;
        if (newBet < MIN_BET) newBet = MIN_BET;
        if (newBet > balance && balance > 0) newBet = balance;
        if (newBet > MAX_BET) newBet = MAX_BET;
        if (newBet <= 0) newBet = MIN_BET;
        currentBet = newBet;
        updateUI();
    }
    function handleBetInput() {
        let val = parseInt(betInput.value);
        if (isNaN(val)) val = MIN_BET;
        val = Math.min(MAX_BET, Math.max(MIN_BET, val));
        if (val > balance && balance > 0) val = balance;
        if (val <= 0) val = MIN_BET;
        currentBet = val;
        updateUI();
    }
    function resetFullGame() {
        if (phase !== "idle") { setMessage("Сначала закончи раунд", true); return; }
        balance = DEFAULT_BALANCE;
        currentBet = Math.min(currentBet, balance);
        saveBalance();
        updateUI();
        resetRound();
        setMessage("Баланс сброшен до 1000", false);
        hammerIcon.innerHTML = "🔨 ?";
        hammerDesc.innerText = "Крути рулетку!";
    }

    // ----- ЗАПУСК -----
    function init() {
        loadBalance();
        buildBlocks();
        updateUI();
        resetRound();
        spinBtn.addEventListener('click', spinRoulette);
        document.getElementById('betMinus').addEventListener('click', () => changeBet(-10));
        document.getElementById('betPlus').addEventListener('click', () => changeBet(10));
        betInput.addEventListener('change', handleBetInput);
        betInput.addEventListener('input', function() {
            let v = parseInt(this.value);
            if (!isNaN(v)) {
                if (v > MAX_BET) this.value = MAX_BET;
                if (v < MIN_BET) this.value = MIN_BET;
            }
        });
        resetBtn.addEventListener('click', resetFullGame);
        window.addEventListener('beforeunload', () => saveBalance());
    }
    init();
</script>
</body>
</html>
